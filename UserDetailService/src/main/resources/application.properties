server.port=8081

spring.application.name=UserDetailService

spring.datasource.url=jdbc:postgresql://localhost:5432/users_db
spring.datasource.username=user_user
spring.datasource.password=user_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.table=flyway_schema_history

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/openapi/swagger-ui.html
springdoc.api-docs.path=/openapi/v1/api-docs
springdoc.paths-to-match=/**

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/file-management

keycloak.client-id=manage-users
keycloak.realm=file-management
