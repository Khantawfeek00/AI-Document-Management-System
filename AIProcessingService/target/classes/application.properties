spring.application.name=AIProcessingService

# Server Configuration
server.port=8084

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/file-management

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=aiprocessing-group
spring.kafka.consumer.auto-offset-reset=earliest

file.service.url=http://localhost:8082

keycloak.client-id=ai-processing-client
keycloak.client-secret=dGciLYwYrx1zLLy5neQodckphFSlgxXi
keycloak.token-uri=http://localhost:9090/realms/file-management/protocol/openid-connect/token

# Logging Configuration
logging.level.root=INFO
logging.level.it.polito.wa2.fileservice=INFO
logging.level.it.polito.wa2.fileservice.services.UploadService=INFO
logging.level.it.polito.wa2.fileservice.controllers.BasicController=INFO
logging.level.it.polito.wa2.fileservice.exception.ProblemDetailsHandler=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

# Google Gemini AI Configuration
#spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
#spring.ai.google.genai.chat.options.model=gemini-2.0-flash


# Disable OpenAI completely
spring.ai.openai.chat.enabled=false
spring.ai.openai.embedding.enabled=false

# PostgreSQL Database Configuration (Step 7 - RAG)
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_processing_db
spring.datasource.username=ai_user
spring.datasource.password=ai_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Ollama Configuration (Step 7 - Chat & Embeddings)
spring.ai.ollama.base-url=http://localhost:11434

spring.ai.ollama.chat.enabled=true
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7

spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Spring AI Vector Store (Step 7 - pgvector auto-configuration)
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

